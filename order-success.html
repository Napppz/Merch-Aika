<!DOCTYPE html>
<!-- Halaman Konfirmasi Invoice Pesanan Digital & Merchandise -->
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Invoice Pesanan — Aika Sesilia Store</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png?v=hiu1" />
  <link rel="shortcut icon" href="/favicon.ico?v=hiu1" />
  <link rel="apple-touch-icon" sizes="192x192" href="/favicon.png?v=hiu1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Nunito:wght@300;400;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=2" />
  <style>
    .success-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      box-sizing: border-box;
    }

    .success-card {
      max-width: 650px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      text-align: center;
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow-blue);
      box-sizing: border-box;
      overflow: hidden;
    }

    .success-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes pop {
      from {
        transform: scale(0);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .success-card h1 {
      font-family: var(--font-display);
      font-size: 2rem;
      color: var(--aqua);
      margin-bottom: 0.5rem;
    }

    .success-card p {
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .order-detail {
      background: rgba(3, 9, 31, 0.6);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 1.8rem;
      margin: 2rem 0;
      text-align: left;
      box-sizing: border-box;
    }

    .order-detail h3 {
      font-family: var(--font-display);
      font-size: 1.1rem;
      color: var(--aqua);
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 0.8rem;
    }

    .invoice-id-badge {
      font-size: 0.92rem;
      color: var(--white);
      font-weight: 800;
      font-family: monospace;
      background: rgba(41, 182, 246, 0.14);
      border: 1px solid rgba(41, 182, 246, 0.35);
      padding: 3px 10px;
      border-radius: 8px;
      white-space: nowrap;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.45rem 1rem;
      font-size: 0.88rem;
      padding: 0.5rem 0;
      border-bottom: 1px solid rgba(41, 182, 246, 0.08);
    }

    .detail-row:last-child {
      border: none;
    }

    .detail-row > span:first-child {
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .detail-row > span:last-child {
      color: var(--white);
      font-weight: 600;
      text-align: right;
      min-width: 0;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .detail-row.summary-amount-row > span:last-child {
      white-space: nowrap;
      flex-shrink: 0;
    }

    .items-list {
      margin: 1.2rem 0;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.75rem;
      font-size: 0.88rem;
      padding: 0.45rem 0;
      color: var(--text-muted);
    }

    .item-row > div {
      min-width: 0;
      flex: 1;
      line-height: 1.45;
    }

    .item-row > span:last-child {
      color: var(--aqua);
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }

    @media (max-width: 640px) {
      .success-wrap {
        padding: 1.25rem 0.75rem 5.5rem;
        align-items: flex-start;
      }

      .success-card {
        padding: 1.55rem 1.05rem;
        border-radius: 18px;
      }

      .success-icon {
        font-size: 3rem;
        margin-bottom: 0.65rem;
      }

      .success-card h1 {
        font-size: 1.45rem;
        line-height: 1.25;
      }

      .order-detail {
        padding: 1.05rem;
        margin: 1.35rem 0;
        border-radius: 14px;
      }

      .order-detail h3 {
        font-size: 0.98rem;
        margin-bottom: 0.9rem;
        padding-bottom: 0.7rem;
      }

      .invoice-id-badge {
        font-size: 0.84rem;
        padding: 3px 8px;
      }

      .detail-row:not(.summary-amount-row) {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.22rem;
        padding: 0.55rem 0;
      }

      .detail-row:not(.summary-amount-row) > span:first-child {
        font-size: 0.76rem;
      }

      .detail-row:not(.summary-amount-row) > span:last-child {
        text-align: left;
        width: 100%;
        font-size: 0.9rem;
        line-height: 1.45;
      }

      .cta-buttons {
        flex-direction: column;
        gap: 0.65rem;
      }

      .cta-buttons a,
      .cta-buttons button {
        width: 100%;
        justify-content: center;
        text-align: center;
        border-radius: 12px !important;
        box-sizing: border-box;
      }
    }

    .cta-buttons {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 1.5rem;
    }

    .btn-print {
      background: rgba(41, 182, 246, 0.15);
      border: 1px solid var(--aqua);
      color: var(--aqua);
      padding: 0.75rem 1.4rem;
      border-radius: 50px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
    }

    .btn-print:hover {
      background: var(--aqua);
      color: var(--deep-ocean);
    }

    @media print {
      body {
        background: #fff !important;
        color: #000 !important;
      }

      .success-wrap {
        padding: 0;
        min-height: auto;
      }

      .success-card {
        border: none;
        box-shadow: none;
        background: #fff;
        color: #000;
        width: 100%;
        max-width: 100%;
        padding: 1rem;
      }

      .cta-buttons,
      .navbar,
      nav {
        display: none !important;
      }

      .order-detail {
        background: #f8fafc;
        border: 1px solid #ccc;
        color: #000;
      }

      .detail-row span:first-child {
        color: #555;
      }

      .detail-row span:last-child {
        color: #000;
      }

      .success-card h1 {
        color: #000;
      }
    }
  </style>
</head>

<body>
  <div class="success-wrap">
    <div class="success-card" id="successCard">
      <div class="success-icon">🎉</div>
      <h1>Pesanan & Invoice Berhasil!</h1>
      <p>Terima kasih telah melakukan transaksi di Aika Sesilia Store! 💙</p>

      <div class="order-detail" id="orderDetail">
        <h3>INVOICE PESANAN</h3>
        <!-- Filled by JS -->
      </div>

      <div class="cta-buttons">
        <a href="profile.html?tab=orders" id="btnSuccessProfile" class="btn-primary" style="padding:0.75rem 1.4rem; border-radius:50px;">📂
          Lihat Status & GDrive di Profil</a>
        <button onclick="window.print()" class="btn-print">🖨️ Cetak / Simpan Invoice (PDF)</button>
        <a href="shop.html" class="btn-ghost" style="padding:0.75rem 1.4rem; border-radius:50px;">🛍️ Lanjut Belanja</a>
        <a href="index.html" class="btn-ghost"
          style="padding:0.75rem 1.4rem; border-radius:50px; border-color:rgba(41,182,246,0.5);">🏠 Kembali ke Halaman
          Utama</a>
      </div>
    </div>
  </div>

  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script>
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    async function loadOrderData() {
      const detail = document.getElementById('orderDetail');
      let order = null;

      // 1. Ambil dari sessionStorage atau localStorage
      try {
        const stored = sessionStorage.getItem('last_order') || localStorage.getItem('last_order');
        if (stored) order = JSON.parse(stored);
      } catch (_) {}

      // 2. Selalu coba ambil data terbaru dari API jika queryId ada & user login (agar status verifikasi + QR E-Tiket langsung update)
      const urlParams = new URLSearchParams(window.location.search);
      const queryId = urlParams.get('id') || urlParams.get('order_id') || sessionStorage.getItem('last_order_id');

      if (queryId) {
        try {
          const userSession = JSON.parse(localStorage.getItem('aika_session') || sessionStorage.getItem('aika_session') || '{}');
          const userEmail = userSession.email;
          const userToken = userSession.token || localStorage.getItem('aika_token') || '';
          if (userEmail) {
            const res = await fetch('/api/user-orders?email=' + encodeURIComponent(userEmail), {
              headers: userToken ? { Authorization: 'Bearer ' + userToken } : {}
            });
            if (res.ok) {
              const resData = await res.json();
              const ordersList = Array.isArray(resData) ? resData : (resData.orders || []);
              const found = ordersList.find(o => String(o.id) === String(queryId));
              if (found) {
                order = found;
                try { sessionStorage.setItem('last_order', JSON.stringify(found)); } catch (_) {}
              }
            }
          }
        } catch (_) {}
      }

      if (!order || !order.id) {
        detail.innerHTML = `
          <div style="text-align:center; padding:2rem 1rem;">
            <div style="font-size:2rem; margin-bottom:0.5rem;">📄</div>
            <p style="color:var(--text-muted); font-size:0.95rem; margin-bottom:0.8rem;">Data invoice tidak ditemukan di sesi browser ini.</p>
            <p style="font-size:0.85rem; color:var(--text-muted);">Jika Anda telah melakukan pembayaran, invoice dan bukti tiket Anda tersimpan aman di menu Profil.</p>
            <a href="profile.html?tab=orders" class="btn-primary" style="display:inline-block; margin-top:1.2rem; padding:0.65rem 1.4rem; border-radius:50px;">Buka Riwayat Pesanan Saya</a>
          </div>
        `;
        return;
      }

      // Parsing daftar item secara aman (bisa berupa Array atau JSON string)
      let itemsList = [];
      try {
        if (Array.isArray(order.items)) {
          itemsList = order.items;
        } else if (typeof order.items === 'string') {
          itemsList = JSON.parse(order.items || '[]');
        }
      } catch (_) {
        itemsList = [];
      }
      if (!Array.isArray(itemsList)) itemsList = [];

      // Parsing info shipping secara aman
      let shippingInfo = {};
      try {
        if (typeof order.shipping === 'string') {
          shippingInfo = JSON.parse(order.shipping || '{}');
        } else if (order.shipping && typeof order.shipping === 'object') {
          shippingInfo = order.shipping;
        }
      } catch (_) {
        shippingInfo = {};
      }

      // Deteksi tiket Nobar Bioskop
      const isNobar = Boolean(shippingInfo && (shippingInfo.isNobar || shippingInfo.nobarTicket));
      const nobarTicket = (shippingInfo && shippingInfo.nobarTicket) || (isNobar ? shippingInfo : null);

      // Deteksi DP & Photopack
      const isDp = Boolean(shippingInfo.paymentScheme === 'dp50' || shippingInfo.isDp);
      const dpAmount = Number(shippingInfo.dpAmount) || Math.ceil((Number(order.total) || 0) * 0.5);
      const remainingAmount = Number(shippingInfo.remainingAmount) || Math.max(0, (Number(order.total) || 0) - dpAmount);
      const hasPhotopack = itemsList.some(i => i && (i.is_photopack || i.category === 'Photopack'));

      const formattedDate = order.date
        ? new Date(order.date).toLocaleString('id-ID', {
            day: '2-digit', month: 'short', year: 'numeric',
            hour: '2-digit', minute: '2-digit'
          }) + ' WIB'
        : new Date().toLocaleString('id-ID', {
            day: '2-digit', month: 'short', year: 'numeric',
            hour: '2-digit', minute: '2-digit'
          }) + ' WIB';

      const itemsHtml = itemsList.map(i => {
        const qty = parseInt(i.qty, 10) || 1;
        const price = Number(i.price) || 0;
        return `
          <div class="item-row">
            <div>
              <span>${qty}x ${escapeHtml(i.name || 'Item Pesanan')}${i.size ? ` • Size ${escapeHtml(i.size)}` : ''}</span>
              ${i.is_photopack ? '<span style="background:rgba(41,182,246,0.2);color:var(--aqua);padding:2px 8px;border-radius:12px;font-size:0.75rem;font-weight:bold;margin-left:6px;">📸 Photopack Digital</span>' : ''}
            </div>
            <span>${formatPrice(price * qty)}</span>
          </div>
        `;
      }).join('');

      let tierBadgeText = 'Tiket Reguler';
      if (nobarTicket) {
        tierBadgeText = nobarTicket.tier === 'vip' ? 'Tiket VIP' : 'Tiket Reguler';
      }

      const orderStatusLower = String(order.status || '').toLowerCase();
      const isNobarVerified = isNobar && ['paid', 'shipped', 'completed'].includes(orderStatusLower);
      const isNobarCheckedIn = isNobar && (orderStatusLower === 'completed' || Boolean(nobarTicket && nobarTicket.checkedIn));
      const safeQrUrl = isNobarVerified && typeof order.nobar_qr_data_url === 'string' && order.nobar_qr_data_url.startsWith('data:image/')
        ? order.nobar_qr_data_url
        : '';
      const statusHtmlBadge = orderStatusLower === 'completed'
        ? '<span style="color:#4ade80; font-weight:700;">✅ Selesai / Sudah Check-in</span>'
        : orderStatusLower === 'paid'
          ? `<span style="color:#4ade80; font-weight:700;">${isNobar ? '🎟️ Terverifikasi (Tiket Resmi Aktif)' : '📦 Terverifikasi (Dikemas)'}</span>`
          : orderStatusLower === 'cancelled'
            ? '<span style="color:#f87171; font-weight:700;">❌ Dibatalkan</span>'
            : '<span style="color:#fde047; font-weight:700;">⏳ Menunggu Verifikasi Admin</span>';

      const profileBtn = document.getElementById('btnSuccessProfile');
      if (profileBtn) {
        profileBtn.textContent = isNobar
          ? '🎟️ Lihat Status & E-Tiket QR di Profil'
          : '📂 Lihat Status & GDrive di Profil';
      }

      detail.innerHTML = `
        <h3>
          <span>📄 INVOICE PESANAN</span>
          <span class="invoice-id-badge">#${escapeHtml(order.id)}</span>
        </h3>
        <div class="detail-row"><span>Waktu Pesanan</span><span>${formattedDate}</span></div>
        <div class="detail-row"><span>Nama Pembeli</span><span>${escapeHtml(order.customerName || '-')}</span></div>
        <div class="detail-row"><span>Email Akun</span><span>${escapeHtml(order.email || '-')}</span></div>
        ${order.phone ? `<div class="detail-row"><span>No. Telepon / WhatsApp</span><span>${escapeHtml(order.phone)}</span></div>` : ''}
        <div class="detail-row"><span>Alamat / Lokasi</span><span>${escapeHtml(order.address || '-')}</span></div>
        ${order.note || order.notes ? `<div class="detail-row"><span>Catatan Pesanan</span><span style="color:var(--gold); font-weight:600;">${escapeHtml(order.note || order.notes)}</span></div>` : ''}
        <div class="detail-row"><span>Metode Pengiriman</span><span>${isNobar ? 'Tiket Masuk Nobar Bioskop (Ambil di Lokasi)' : escapeHtml(shippingInfo.name || 'Digital Delivery')}</span></div>
        ${shippingInfo.resi ? `<div class="detail-row"><span>No. Resi</span><span style="font-weight:700; color:var(--sky-blue); letter-spacing:1px">${escapeHtml(shippingInfo.resi)}</span></div>` : ''}
        <div class="detail-row">
          <span>Skema Pembayaran</span>
          <span>${isDp ? '<span style="display:inline-block;background:rgba(234,179,8,0.2);color:#fde047;border:1px solid rgba(234,179,8,0.4);padding:3px 10px;border-radius:10px;font-size:0.78rem;font-weight:bold;">⚡ DP 50% (Uang Muka)</span>' : '<span style="display:inline-block;background:rgba(41,182,246,0.15);color:var(--aqua);padding:3px 10px;border-radius:10px;font-size:0.78rem;font-weight:bold;">💎 Bayar Penuh QRIS</span>'}</span>
        </div>
        <div class="detail-row">
          <span>Status Pembayaran</span>
          ${statusHtmlBadge}
        </div>

        ${isNobar && nobarTicket ? `
          <div style="margin:1rem 0; padding:1.05rem; background:linear-gradient(135deg, ${nobarTicket.tier === 'vip' ? 'rgba(234,179,8,0.16), rgba(3,9,31,0.9)' : 'rgba(2,132,199,0.16), rgba(3,9,31,0.9)'}); border:1.5px solid ${isNobarVerified ? '#22c55e' : (nobarTicket.tier === 'vip' ? 'rgba(234,179,8,0.5)' : 'var(--aqua)')}; border-radius:12px; font-size:0.86rem; color:var(--white); line-height:1.55;">
            <div style="font-weight:800; color:${nobarTicket.tier === 'vip' ? '#fde047' : 'var(--aqua)'}; font-size:0.94rem; margin-bottom:0.45rem;">
              🎟️ BUKTI TIKET NOBAR BIOSKOP — ${escapeHtml(tierBadgeText)}
            </div>
            <div><strong>Jumlah Tiket:</strong> ${parseInt(nobarTicket.qty, 10) || 1} Kursi</div>
            <div><strong>Daftar Nama Peserta:</strong> ${(nobarTicket.participants || []).map((p, idx) => `${idx + 1}. ${escapeHtml(p)}`).join(' • ')}</div>
            ${nobarTicket.includesMerch ? `<div><strong>Paket Merch:</strong> <span style="color:var(--gold);">${escapeHtml(nobarTicket.merchBundle || 'Photocard & Poster')} (Diambil langsung di lokasi bioskop)</span></div>` : ''}
            ${safeQrUrl ? `
              <div style="margin:0.9rem 0 0.4rem; padding:1rem; background:#ffffff; border-radius:12px; text-align:center; color:#0f172a;">
                <div style="font-weight:800; color:#0284c7; font-size:0.86rem; margin-bottom:0.5rem;">
                  ${isNobarCheckedIn ? '✅ SUDAH CHECK-IN DI BIOSKOP' : '📱 QR CODE E-TIKET RESMI (SIAP SCAN)'}
                </div>
                <img src="${safeQrUrl}" alt="QR E-Tiket" style="width:190px; max-width:100%; height:auto; display:inline-block;" />
                ${order.nobar_ticket_token ? `<div style="font-family:monospace; font-size:0.72rem; color:#64748b; margin-top:4px; word-break:break-all;">${escapeHtml(order.nobar_ticket_token)}</div>` : ''}
              </div>
            ` : `
              <div style="margin-top:0.6rem; padding-top:0.5rem; border-top:1px solid rgba(255,255,255,0.12); color:var(--text-muted); font-size:0.8rem;">
                Bukti transfer QRIS telah berhasil diunggah. Setelah diverifikasi Admin, <strong>QR Code E-Tiket</strong> untuk scan check-in di pintu bioskop akan otomatis muncul di halaman <strong>Profil &gt; Riwayat Pesanan</strong> dan dikirim ke email Anda.
              </div>
            `}
          </div>
        ` : ''}

        ${isDp ? `
          <div style="margin:1rem 0; padding:1rem; background:rgba(234,179,8,0.1); border:1px solid rgba(234,179,8,0.3); border-radius:10px; font-size:0.85rem; color:var(--white);">
            <strong style="color:#fde047; display:block; margin-bottom:0.25rem;">⚡ Informasi Pembayaran DP 50%:</strong>
            Anda telah membayar uang muka DP 50% sebesar <strong style="color:#4ade80;">${formatPrice(dpAmount)}</strong>. Sisa tagihan pelunasan sebesar <strong style="color:var(--gold);">${formatPrice(remainingAmount)}</strong> akan diinformasikan saat pesanan siap dikirim / COD.
          </div>
        ` : ''}

        ${hasPhotopack ? `
          <div style="margin:1rem 0; padding:0.9rem; background:rgba(41,182,246,0.1); border:1px solid var(--aqua); border-radius:10px; font-size:0.85rem; color:var(--white);">
            <strong style="color:var(--aqua); display:block; margin-bottom:0.2rem;">⚡ Informasi Akses Google Drive:</strong>
            Setelah pembayaran Anda diverifikasi oleh Admin, tombol aktif <strong>📂 Buka Google Drive</strong> akan langsung muncul di halaman <strong>Profil > Riwayat Pesanan</strong> Anda.
          </div>
        ` : ''}

        <div class="items-list">${itemsHtml}</div>
        <div class="detail-row summary-amount-row"><span>Ongkos Kirim</span><span>${isNobar ? 'Rp 0 (Di Lokasi)' : formatPrice(shippingInfo.price || 0)}</span></div>
        ${shippingInfo.discount ? `<div class="detail-row summary-amount-row"><span style="color:#4caf50">Diskon Voucher (${escapeHtml(shippingInfo.discount.code)})</span><span style="color:#4caf50">- ${formatPrice(shippingInfo.discount.amount)}</span></div>` : ''}
        <div class="detail-row summary-amount-row" style="font-weight:700; font-size:1.02rem; border-top:1px solid var(--card-border); padding-top:0.8rem; margin-top:0.5rem;"><span style="color:var(--white)">Total Nilai Pesanan</span><span style="color:var(--aqua)">${formatPrice(order.total)}</span></div>
        ${isDp ? `
          <div class="detail-row summary-amount-row" style="font-weight:700; font-size:1.05rem;"><span style="color:#4ade80;">Tagihan DP 50% (Dibayar)</span><span style="color:#4ade80;">${formatPrice(dpAmount)}</span></div>
          <div class="detail-row summary-amount-row" style="font-weight:700; font-size:0.95rem;"><span style="color:var(--gold);">Sisa Pelunasan Nanti</span><span style="color:var(--gold);">${formatPrice(remainingAmount)}</span></div>
        ` : ''}
      `;
    }

    document.addEventListener('DOMContentLoaded', loadOrderData);
  </script>
  <!-- Floating Back to Home Button for Mobile (Android & iOS) -->
  <a href="index.html" class="mobile-floating-home-btn" id="successMobileHomeFab" aria-label="Kembali ke Halaman Utama">
    <span class="fab-icon">🏠</span>
    <span>Halaman Utama</span>
  </a>
</body>

</html>
