<!DOCTYPE html>
<!-- Presentasi: Halaman katalog produk untuk menampilkan daftar merchandise berdasarkan kategori dan pencarian. -->
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Shop — Aika Sesilia Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Nunito:wght@300;400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .shop-layout {
      max-width: 1300px;
      margin: 0 auto;
      padding: 2rem 3rem 6rem;
    }

    .shop-controls {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 2.5rem;
      padding: 1.5rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      backdrop-filter: blur(10px);
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      background: rgba(3, 9, 31, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 50px;
      padding: 0.7rem 1.2rem;
      color: var(--white);
      font-family: var(--font-body);
      font-size: 0.9rem;
      outline: none;
      transition: var(--transition);
    }

    .search-box:focus {
      border-color: var(--aqua);
    }

    .filter-tabs {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .filter-tab {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 0.5rem 1.2rem;
      border-radius: 50px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: var(--transition);
      font-family: var(--font-body);
    }

    .filter-tab.active,
    .filter-tab:hover {
      background: var(--sea-blue);
      border-color: var(--sea-blue);
      color: var(--white);
    }

    .product-count {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-left: auto;
    }
  </style>
</head>

<body class="has-bottom-nav">
  <div class="cursor-glow"></div>

  <nav class="navbar">
    <a href="index.html" class="nav-brand" title="Kembali ke Halaman Utama">
      <span class="brand-logo">✦</span>
      <span class="brand-name">Aika Sesilia</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html" class="active">Shop</a></li>
      <li><a href="index.html#about">About</a></li>
      <li><a href="index.html#contact">Contact</a></li>
    </ul>
    <div class="nav-actions">
      <a href="index.html" class="nav-back-btn" title="Kembali ke Halaman Utama">
        <span class="back-arrow">←</span>
        <span class="back-text-full">Halaman Utama</span>
        <span class="back-text-mobile">Beranda</span>
      </a>
      <button class="cart-btn" onclick="toggleCart()">
        🛒 <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </nav>

  <div class="page-header">
    <p class="section-eyebrow">✦ Official Merchandise ✦</p>
    <h1>Semua Produk</h1>
    <p>Koleksi eksklusif langsung dari Aika Sesilia</p>
  </div>

  <div class="shop-layout">
    <div class="shop-controls">
      <input type="text" class="search-box" placeholder="🔍 Cari produk..." id="searchInput" oninput="applyFilter()" />
      <div class="filter-tabs" id="filterTabs">
        <button class="filter-tab active" onclick="setFilter('Semua', this)">Semua</button>
        <button class="filter-tab" onclick="setFilter('Pakaian', this)">👕 Pakaian</button>
        <button class="filter-tab" onclick="setFilter('Aksesoris', this)">💎 Aksesoris</button>
        <button class="filter-tab" onclick="setFilter('Foto & Print', this)">🖼️ Foto & Print</button>
        <button class="filter-tab" onclick="setFilter('Acrylic', this)">🧿 Acrylic</button>
        <button class="filter-tab" onclick="setFilter('Photopack', this)">📸 Photopack</button>
      </div>
      <span class="product-count" id="productCount"></span>
    </div>

    <div class="product-grid" id="shopGrid">
      <div class="loading-placeholder">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>© 2025 Aika Sesilia Official Store. All rights reserved.</p>
  </footer>

  <!-- CART -->
  <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
  <aside class="cart-sidebar" id="cartSidebar">
    <div class="cart-header">
      <h3>🛒 Keranjang</h3>
      <button onclick="toggleCart()" class="cart-close">✕</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-footer">
      <div class="cart-total">Total: <strong id="cartTotal">Rp 0</strong></div>
      <button class="btn-primary w100" onclick="goToCheckout()">Checkout →</button>
    </div>
  </aside>

  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script>
    let currentFilter = 'Semua';

    function setFilter(cat, el) {
      currentFilter = cat;
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      applyFilter();
    }

    function applyFilter() {
      const search = document.getElementById('searchInput').value;
      loadShopProducts(currentFilter, search);
      Products.getAll().then(all => {
        let filtered = all.map(p => ({ ...p, category: normalizeProductCategory(p.category) }));
        if (currentFilter !== 'Semua') filtered = filtered.filter(p => p.category === currentFilter);
        if (search) filtered = filtered.filter(p => p.name.toLowerCase().includes(search.toLowerCase()));
        document.getElementById('productCount').textContent = `${filtered.length} produk`;
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const cat = urlParams.get('category') || urlParams.get('cat');
      if (cat) {
        const tabs = Array.from(document.querySelectorAll('.filter-tab'));
        const foundTab = tabs.find(t => t.textContent.toLowerCase().includes(cat.toLowerCase()));
        if (foundTab) {
          setFilter(cat, foundTab);
          return;
        }
      }
      loadShopProducts();
      applyFilter();
    });
  </script>
  <!-- MOBILE BOTTOM NAVIGATION BAR -->
  <nav class="mobile-bottom-nav" id="mobileBottomNav" aria-label="Navigasi Bawah">
    <a href="index.html" class="bottom-nav-item" id="bnav-home">
      <span class="bnav-icon">
        <svg viewBox="0 0 24 24">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
      </span>
      <span class="bnav-label">Beranda</span>
    </a>

    <a href="shop.html" class="bottom-nav-item active" id="bnav-shop">
      <span class="bnav-icon">
        <svg viewBox="0 0 24 24">
          <path d="M19 6h-2c0-2.76-2.24-5-5-5S7 3.24 7 6H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-7-3c1.66 0 3 1.34 3 3H9c0-1.66 1.34-3 3-3zm7 17H5V8h14v12zm-7-8c-1.66 0-3-1.34-3-3H7c0 2.76 2.24 5 5 5s5-2.24 5-5h-2c0 1.66-1.34 3-3 3z"/>
        </svg>
      </span>
      <span class="bnav-label">Katalog</span>
    </a>

    <button type="button" class="bottom-nav-item bnav-cart-btn" onclick="toggleCart()" id="bnav-cart" aria-label="Buka Keranjang">
      <span class="bnav-icon">
        <svg viewBox="0 0 24 24">
          <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
        </svg>
        <span class="bnav-badge" id="mobileBottomCartCount" style="display:none">0</span>
      </span>
      <span class="bnav-label">Keranjang</span>
    </button>

    <a href="profile.html?tab=wishlist" class="bottom-nav-item" id="bnav-wishlist">
      <span class="bnav-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </span>
      <span class="bnav-label">Favorit</span>
    </a>

    <a href="profile.html" class="bottom-nav-item" id="bnav-account">
      <span class="bnav-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
      </span>
      <span class="bnav-label">Akun</span>
    </a>
  </nav>
</body>

</html>
